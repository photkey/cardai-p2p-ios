name: CardAICollector
options:
  bundleIdPrefix: com.cardai
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.2.0

targets:
  CardAICollector:
    type: application
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardai.collector.ios
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: IrohLib
        product: IrohLib
  CardAICollectorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: Tests
    dependencies:
      - target: CardAICollector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
