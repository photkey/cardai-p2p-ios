name: ios

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData and SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode26-iroh120-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-iroh120-

      - name: Resolve package dependencies
        run: |
          xcodebuild -project CardAICollector.xcodeproj -scheme CardAICollector \
            -resolvePackageDependencies

      - name: Build for simulator
        run: |
          xcodebuild -project CardAICollector.xcodeproj -scheme CardAICollector \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive (unsigned)
        if: env.IOS_CERTIFICATE_BASE64 == ''
        run: |
          xcodebuild -project CardAICollector.xcodeproj -scheme CardAICollector \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/CardAICollector.xcarchive \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Upload unsigned archive
        if: env.IOS_CERTIFICATE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: CardAICollector-unsigned-xcarchive
          path: build/CardAICollector.xcarchive
          if-no-files-found: error

      - name: Import signing identity and profile
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          BUNDLE_ID="${IOS_BUNDLE_ID:-com.cardai.collector.ios}"
          xcodebuild -project CardAICollector.xcodeproj -scheme CardAICollector \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/CardAICollector.xcarchive \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" archive
          mkdir -p build/ipa
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CardAICollector.xcarchive \
            -exportPath build/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        if: env.IOS_CERTIFICATE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CardAICollector-ipa
          path: build/ipa
          if-no-files-found: error
